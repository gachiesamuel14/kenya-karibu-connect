<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in · Karibu Connect</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="nav">
    <a class="logo" href="index.html">Karibu<span>Connect</span></a>
    <a class="btn primary" href="register.html">Join free</a>
  </header>
  <section class="auth form-card">
    <h2>Welcome back</h2>
    <p class="lede">Demo login stores a session in your browser only.</p>
    <form id="loginForm">
      <label>Email</label>
      <input name="email" type="email" required placeholder="you@example.com" />
      <label>Password</label>
      <input name="password" type="password" required />
      <br/><br/>
      <button class="btn primary" type="submit">Log in</button>
    </form>
  </section>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
